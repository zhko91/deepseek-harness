name: DeepSeek Harness - Manual Web Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-web-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-smoke:
    name: Build and probe localhost Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: 'true'
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_CONCURRENCY: '1'
      DSH_GATE_FAIL_FAST: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
      HOME: ${{ runner.temp }}/dsh-home
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: |
          mkdir -p "$HOME"
          timeout 360s pnpm install --frozen-lockfile --ignore-scripts
      - name: Build artifacts
        run: timeout 480s pnpm run build:artifacts
      - name: Start Web UI and verify local HTTP response
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-empty-workspace"
          cd "$RUNNER_TEMP/dsh-empty-workspace"
          "$GITHUB_WORKSPACE/node_modules/.bin/pnpm" --dir "$GITHUB_WORKSPACE" dsh web --no-open > "$RUNNER_TEMP/dsh-web.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Web process exited early'
              tail -80 "$RUNNER_TEMP/dsh-web.log"
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 2 -o "$RUNNER_TEMP/dsh-response.html" http://127.0.0.1:3080/ 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo 'Web UI did not respond within 90 seconds'
            tail -80 "$RUNNER_TEMP/dsh-web.log"
            exit 1
          fi
          test -s "$RUNNER_TEMP/dsh-response.html"
          echo 'Local Web UI returned a nonempty successful HTTP response'
          echo '## Web UI smoke test: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Localhost HTTP probe succeeded; no model API was called' >> "$GITHUB_STEP_SUMMARY"
