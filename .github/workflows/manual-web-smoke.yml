name: DeepSeek Harness - Manual Web Startup Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-web-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-smoke:
    name: Build and check localhost Web server startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: 'true'
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_CONCURRENCY: '1'
      DSH_GATE_FAIL_FAST: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: |
          timeout 360s pnpm install --frozen-lockfile --ignore-scripts
      - name: Build artifacts
        run: timeout 480s pnpm run build:artifacts
      - name: Start Web UI and verify local TCP listener
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-home"
          HOME="$RUNNER_TEMP/dsh-home" pnpm dsh web --no-open > "$RUNNER_TEMP/dsh-web.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f "$RUNNER_TEMP/dsh-web.log"' EXIT
          ready=0
          for i in $(seq 1 45); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Web process exited before opening the local port (logs withheld to protect startup credentials)'
              exit 1
            fi
            if (echo > /dev/tcp/127.0.0.1/3080) >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo 'Local TCP port 3080 did not become available within 90 seconds'
            exit 1
          fi
          echo 'Local server is listening on 127.0.0.1:3080'
          {
            echo '## Web startup smoke: PASS'
            echo '- Server process remained alive and local TCP port 3080 accepted a connection'
            echo '- HTTP authentication and UI rendering were NOT tested'
            echo '- No startup tokens were printed or stored as artifacts'
          } >> "$GITHUB_STEP_SUMMARY"
